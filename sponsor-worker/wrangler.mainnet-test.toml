# Pocket Wallet AUDD — MAINNET TEST (Ric's capped live test). NOT DEPLOYED.
# Deploying needs Ric's explicit go-ahead (RIC-658). Shared-account ledger only:
# official AUDD issuer only, hard cap A$300 total (enforced in code; config
# above 300 is refused). The per-user sponsor endpoints refuse to run here.
# Secrets (from 1Password only, via `wrangler secret put … --config sponsor-worker/wrangler.mainnet-test.toml`):
#   SHARED_SECRET  — the shared account's secret key (item "Pocket Wallet AUDD shared account (MAINNET TEST)")
#   ADMIN_TOKEN    — long random token for /v1/ledger/admin/* (settle, suspense, refund)
name = "pocketwallet-audd-mainnet-test"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NETWORK = "mainnet-test"
HORIZON_URL = "https://horizon.stellar.org"
ASSET = "AUDD:GDC7X2MXTYSAKUUGAIQ7J7RPEIM7GXSAIWFYWWH4GLNFECQVJJLB2EEU"
ALLOWED_ORIGINS = ""   # set to the exact preview origin of the mainnet-test app build
MAX_TOTAL_AUDD = "300"
MAX_USER_AUDD = "300"
MAX_SEND_AUDD = "300"
MAX_ONBOARD_PER_IP_PER_HOUR = "5"
MAX_SENDS_PER_USER_PER_MINUTE = "10"
FEE_PER_OP_STROOPS = "100"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "SponsorCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SponsorCoordinator"]
