# Cloudflare Workers static-assets deployment for PocketWallet.
# The site is a static export (./out); Workers Assets serves it at the edge.
# Deploy:  CLOUDFLARE_API_TOKEN=... npx wrangler deploy
name = "pocketwallet"
compatibility_date = "2024-11-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
